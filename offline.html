<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00843d">
<title>You're offline · Medi-O</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f5; color: #1d2b22;
         font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.5rem; margin: 16px 0 6px; }
  p { color: #5d6b63; max-width: 320px; margin: 0 auto 20px; }
  button { background: #00843d; color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 1rem; font-weight: 700; }
</style>
</head>
<body>
  <div>
    <img src="assets/img/app-icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Medi-O needs an internet connection to show your orders, prescriptions and messages.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
